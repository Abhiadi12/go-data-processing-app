name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        if: matrix.go == 'stable'
        run: |
          total=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')
          echo "### Test coverage: $total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: build image
        run: docker build -t datapipe:ci .

      - name: smoke test
        run: |
          docker run -d --name datapipe -p 9090:9090 datapipe:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:9090/healthz && break
            sleep 1
          done
          curl -fsS localhost:9090/healthz
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:9090/api/v1/pipelines \
            -H 'Content-Type: application/json' --data @examples/orders-job.json)
          test "$code" = 202

      - name: container logs
        if: always()
        run: docker logs datapipe || true
