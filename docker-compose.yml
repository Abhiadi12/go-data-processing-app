services:
  datapipe:
    build: .
    image: datapipe:local
    ports:
      - "9090:9090"
    environment:
      LOG_FORMAT: text
      API_KEY: ${API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-}
    volumes:
      - datapipe-data:/var/lib/datapipe
    restart: unless-stopped

volumes:
  datapipe-data:
